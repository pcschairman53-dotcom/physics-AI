<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background Glow -->
  <circle cx="50%" cy="50%" r="48" fill="url(#glow)"/>
  
  <!-- Electron Orbits -->
  <ellipse cx="50%" cy="50%" rx="35" ry="12" fill="none" stroke="#22d3ee" stroke-width="2.5" transform="rotate(30 50 50)"/>
  <ellipse cx="50%" cy="50%" rx="35" ry="12" fill="none" stroke="#a855f7" stroke-width="2.5" transform="rotate(90 50 50)"/>
  <ellipse cx="50%" cy="50%" rx="35" ry="12" fill="none" stroke="#3b82f6" stroke-width="2.5" transform="rotate(150 50 50)"/>
  
  <!-- Nucleus -->
  <circle cx="50%" cy="50%" r="6" fill="#ffffff" filter="drop-shadow(0 0 6px #22d3ee)"/>
</svg>
